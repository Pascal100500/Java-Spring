<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Магазины</title>
</head>
<body>

<h1>Магазины</h1>

<p>Страница магазинов работает!</p>

<div th:each="shop : ${shops}">
    <h2>
        <a th:href="@{/shops/{id}(id=${shop.id})}"
           th:text="${shop.name}">
        </a>
    </h2>

    <p th:text="${shop.category}"></p>
</div>

</body>
</html>
